mig:
  strategy: single

migManager:
  enabled: true
  config:
    create: true
    name: custom-mig-config
    data:
      config.yaml: |
        version: v1
        mig-configs:
          all-disabled:
            - devices: all
              mig-enabled: false
          all-1g.10gb:
            - devices: all
              mig-enabled: true
              mig-devices:
                "1g.10gb": 7