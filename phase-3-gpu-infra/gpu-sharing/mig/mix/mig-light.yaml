apiVersion: apps/v1
kind: Deployment
metadata:
  name: mig-light
  namespace: default
spec:
  replicas: 2
  selector:
    matchLabels:
      app: mig-light
  template:
    metadata:
      labels:
        app: mig-light
    spec:
      tolerations:
        - key: nvidia.com/gpu
          operator: Exists
          effect: NoSchedule

      containers:
        - name: cuda-sample
          image: "nvcr.io/nvidia/k8s/cuda-sample:vectoradd-cuda11.7.1-ubuntu20.04"
          command: ["/bin/bash", "-c", "--"]
          args:
            - while true; do /cuda-samples/vectorAdd; done
          resources:
            limits:
              nvidia.com/mig-1g.10gb: 1