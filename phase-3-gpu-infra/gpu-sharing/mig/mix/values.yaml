mig:
  strategy: mixed

migManager:
  enabled: true
  config:
    create: true
    name: custom-mig-config
    data:
      config.yaml: |
        version: v1
        mig-configs:
          all-disabled:
            - devices: all
              mig-enabled: false
          large-plus-small:
            - devices: all
              mig-enabled: true
              mig-devices:
                "3g.40gb": 1
                "1g.10gb": 2